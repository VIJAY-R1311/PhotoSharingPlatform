<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Team Dashboard | PhotoShare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar app-navbar">

    <div class="container">

        <a class="brand"
           th:href="@{/team/dashboard}">
            📸 PhotoShare
        </a>

        <div class="d-flex align-items-center gap-3">

            <a class="nav-link"
               th:href="@{/home}">
                Home
            </a>

            <form th:action="@{/logout}"
                  method="post"
                  class="mb-0">

                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Logout
                </button>

            </form>

        </div>

    </div>

</nav>


<main class="page-container">

    <div class="page-header mb-4">

        <h1 class="h3 mb-1">
            Welcome,
            <span th:text="${teamMember.username}">
                Team Member
            </span>
        </h1>

        <p class="text-muted mb-0">
            Your assigned events
        </p>

    </div>


    <div th:if="${#lists.isEmpty(events)}"
         class="empty-state">

        <h3 class="h5">
            No events assigned
        </h3>

        <p class="text-muted mb-0">
            You currently don't have any assigned events.
        </p>

    </div>


    <div th:unless="${#lists.isEmpty(events)}"
         class="row g-3">

        <div th:each="event : ${events}"
             class="col-md-6">

            <div class="event-card p-3">

                <div class="d-flex justify-content-between align-items-start gap-3">

                    <div>

                        <h3 class="h5 mb-1"
                            th:text="${event.name}">
                            Event Name
                        </h3>

                        <p class="text-muted small mb-0"
                           th:text="${event.description}">
                            Event description
                        </p>

                    </div>

                    <a th:href="@{/team/event/{id}(id=${event.id})}"
                       class="btn-primary-custom btn-sm text-nowrap">

                        Open Event

                    </a>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
