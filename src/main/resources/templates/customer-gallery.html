<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${gallery.event.name} + ' | Photo Gallery'">
        Photo Gallery | PhotoShare
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="gallery-page">


<header class="gallery-header">

    <div class="container">

        <h1 th:text="${gallery.event.name}">
            Event Gallery
        </h1>

        <p>
            Photo Gallery
        </p>

    </div>

</header>


<main class="gallery-container">

    <!-- Gallery information -->

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <div>

            <h2 class="h5 mb-1">
                Photos
            </h2>

            <p class="text-muted small mb-0">
                Thank you for visiting the gallery.
            </p>

        </div>

        <span class="badge text-bg-light border"
              th:text="${#lists.size(photos)} + ' photos'">
            0 photos
        </span>

    </div>


    <!-- Empty state -->

    <div th:if="${#lists.isEmpty(photos)}"
         class="empty-state">

        <h3 class="h5">
            No photos available
        </h3>

        <p class="text-muted mb-0">
            There are currently no photos available in this gallery.
        </p>

    </div>


    <!-- Photo grid -->

    <div th:unless="${#lists.isEmpty(photos)}"
         class="gallery-grid">

        <div th:each="photo : ${photos}"
             class="gallery-item">

            <button type="button"
                    class="gallery-photo-button"
                    th:attr="data-image=${photo.storageLocation},
                             data-title=${photo.fileName}"
                    onclick="openLightbox(this)">

                <img th:src="${photo.storageLocation}"
                     th:alt="${photo.fileName}"
                     loading="lazy">

                <div class="gallery-photo-overlay">

                    <span>
                        🔍 View Photo
                    </span>

                </div>

            </button>

            <div class="gallery-photo-info">

                <div class="fw-semibold text-truncate"
                     th:text="${photo.fileName}">
                    photo.jpg
                </div>

            </div>

        </div>

    </div>

</main>


<!-- Lightbox -->

<div id="photoLightbox"
     class="photo-lightbox"
     onclick="closeLightbox(event)">

    <button type="button"
            class="lightbox-close"
            onclick="closeLightbox()">
        ×
    </button>

    <button type="button"
            class="lightbox-image-button"
            onclick="event.stopPropagation()">

        <img id="lightboxImage"
             src=""
             alt="">

        <div id="lightboxTitle"
             class="lightbox-title">
        </div>

    </button>

</div>


<script>

    function openLightbox(button) {

        const image = button.getAttribute("data-image");
        const title = button.getAttribute("data-title");

        const lightbox =
            document.getElementById("photoLightbox");

        const lightboxImage =
            document.getElementById("lightboxImage");

        const lightboxTitle =
            document.getElementById("lightboxTitle");

        lightboxImage.src = image;
        lightboxImage.alt = title;
        lightboxTitle.innerText = title;

        lightbox.classList.add("active");

        document.body.classList.add("lightbox-open");
    }


    function closeLightbox(event) {

        if (event &&
            event.target !== event.currentTarget) {

            return;
        }

        const lightbox =
            document.getElementById("photoLightbox");

        lightbox.classList.remove("active");

        document.body.classList.remove("lightbox-open");
    }


    document.addEventListener("keydown", function(event) {

        if (event.key === "Escape") {

            closeLightbox();

        }

    });

</script>

</body>

</html>
