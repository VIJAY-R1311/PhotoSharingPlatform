<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Photo Sharing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .signup-container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="signup-container">

    <h2>Create Account</h2>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/signup}" th:object="${user}" method="post">

        <input
                type="text"
                th:field="*{username}"
                placeholder="Username"
                required>

        <input
                type="email"
                th:field="*{email}"
                placeholder="Email"
                required>

        <input
                type="password"
                th:field="*{password}"
                placeholder="Password"
                required>

        <button type="submit">
            Sign Up
        </button>

    </form>

</div>

</body>
</html>
