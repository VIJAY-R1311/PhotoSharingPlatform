<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Private Gallery | PhotoShare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="gallery-page">

<main class="d-flex align-items-center justify-content-center min-vh-100 px-3">

    <div class="app-card p-4"
         style="width: 420px; max-width: 100%;">

        <div class="text-center">

            <div class="mb-2"
                 style="font-size: 2rem;">
                🔒
            </div>

            <h1 class="h4 mb-2">
                Private Gallery
            </h1>

            <p class="text-muted mb-4"
               th:text="${gallery.event.name}">
                Event Name
            </p>

        </div>


        <!-- Error -->

        <div th:if="${error != null}"
             class="alert-danger-custom mb-3"
             th:text="${error}">
            Incorrect PIN.
        </div>


        <!-- PIN Form -->

        <form th:action="@{/gallery/{token}/verify(token=${gallery.galleryToken})}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <label for="pin"
                   class="form-label fw-semibold">
                Gallery PIN
            </label>

            <input type="text"
                   id="pin"
                   name="pin"
                   class="form-control text-center"
                   placeholder="Enter PIN"
                   minlength="4"
                   maxlength="6"
                   pattern="[0-9]{4,6}"
                   inputmode="numeric"
                   autocomplete="off"
                   required>

            <button type="submit"
                    class="btn-primary-custom w-100 mt-3">
                View Gallery
            </button>

        </form>


        <p class="text-muted small text-center mt-3 mb-0">
            Enter the PIN provided by your event photographer
            to access the gallery.
        </p>

    </div>

</main>

</body>

</html>
