<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gallery Unavailable</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .card {
            background: white;
            width: 450px;
            max-width: 92%;
            padding: 40px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        }

        .icon {
            font-size: 50px;
        }

        h1 {
            margin: 20px 0 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">
        ⚠️
    </div>

    <h1>
        Gallery Unavailable
    </h1>

    <p>
        This gallery does not exist, has not been published,
        or is no longer available.
    </p>

</div>

</body>

</html>
